[env:esp32dev]
board = esp32dev
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; If you experience flashing issues, try lowering upload_speed to 57600 or specify upload_port = COM6
; upload_speed = 57600
; upload_port = COM6

; WROVER-specific flash settings (matches typical WROVER-E modules)
board_build.flash_mode = dio
board_build.flash_freq = 40m
board_build.flash_size = 4MB

; NOTE: When flashing, disconnect motors and other peripherals from GPIOs (especially strapping pins)
lib_deps =
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit BusIO@^1.10.6
  ; Nextion library: using local copy in /lib/Nextion instead of the remote ITEADLIB which requires SoftwareSerial
  ; If you prefer the remote library, note it currently depends on SoftwareSerial (not available on ESP32).